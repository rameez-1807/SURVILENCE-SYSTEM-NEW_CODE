services:
  - type: web
    name: ai-surveillance-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: AI Surveillance System
      - key: APP_VERSION
        value: 1.0.0
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: DETECTION_ENABLED
        value: "false"
      - key: PYTHONPATH
        value: "."
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
