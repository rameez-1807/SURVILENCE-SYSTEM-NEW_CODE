name: CI/CD Pipeline & EC2 Auto-Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Test & Quality Checks
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: 🧪 Run Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx

      - name: 🔍 Python Code Syntax & Integrity Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: ⚛️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: 🏗️ Verify Frontend Production Build
        working-directory: frontend
        env:
          VITE_API_URL: "/api/v1"
          VITE_WS_URL: ""
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Automated Deployment to AWS EC2
  # ─────────────────────────────────────────────────────────────
  deploy-to-ec2:
    name: 🚀 Deploy to AWS EC2
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Validate EC2 Secrets Configuration
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::warning ::Secret EC2_HOST is not set. Deployment step will be skipped."
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          else
            echo "SKIP_DEPLOY=false" >> $GITHUB_ENV
          fi

      - name: 🚀 Execute Remote Update Script on EC2 via SSH
        if: env.SKIP_DEPLOY == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          timeout: 10m
          script: |
            echo "=============================================="
            echo "🚀 Initiating Automated CI/CD Deploy on EC2..."
            echo "=============================================="
            
            # Find project directory
            if [ -d "/home/ec2-user/SURVILENCE-SYSTEM-NEW_CODE" ]; then
              cd "/home/ec2-user/SURVILENCE-SYSTEM-NEW_CODE"
            elif [ -d "/home/ec2-user/AI_SURVILENCE-SYSTEM" ]; then
              cd "/home/ec2-user/AI_SURVILENCE-SYSTEM"
            elif [ -d "$HOME/SURVILENCE-SYSTEM-NEW_CODE" ]; then
              cd "$HOME/SURVILENCE-SYSTEM-NEW_CODE"
            else
              echo "Error: Could not locate project directory on EC2 server."
              exit 1
            fi

            # Execute automated deployment update
            chmod +x deploy/ec2-update.sh
            bash deploy/ec2-update.sh

            echo "=============================================="
            echo "✅ CI/CD Deployment successfully executed!"
            echo "=============================================="
